<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Claude Certified Architect Foundations</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/assets/manifest.webmanifest">
<meta name="theme-color" content="#C72D1A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/course.css">
<style>
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
    display: grid; place-items: center;
    padding: 2rem;
  }
  .auth-card {
    max-width: 460px; width: 100%;
    background: var(--paper-card);
    border: 1px solid var(--rule-faint);
    border-radius: 10px;
    padding: 2.4rem 2.2rem;
    text-align: center;
  }
  .auth-mark {
    display: inline-flex; gap: 8px; align-items: center;
    margin-bottom: 1.4rem;
    font-family: var(--font-mono); font-size: 0.74rem;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-mute);
  }
  .auth-mark .mark {
    display: inline-block; width: 28px; height: 28px;
    background: var(--lava); color: white;
    font-family: var(--font-display);
    font-variation-settings: "opsz" 24, "wght" 540;
    border-radius: 5px;
    display: inline-grid; place-items: center;
    font-size: 1rem;
  }
  .auth-eyebrow {
    font-family: var(--font-mono); font-size: 0.72rem;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--lava); margin-bottom: 0.8rem;
  }
  h1 {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 144, "SOFT" 60, "wght" 380;
    font-size: clamp(1.8rem, 4vw, 2.4rem);
    color: var(--ink); letter-spacing: -0.03em;
    margin-bottom: 0.8rem;
  }
  h1 em { color: var(--lava); font-style: italic; }
  p { color: var(--ink-soft); margin-bottom: 1.6rem; line-height: 1.55; }
  .login-btn {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--ink); color: var(--paper);
    border: 1px solid var(--ink);
    padding: 0.95rem 1.6rem; border-radius: 6px;
    font-family: var(--font-mono); font-size: 0.78rem;
    letter-spacing: 0.12em; text-transform: uppercase;
    text-decoration: none; cursor: pointer;
    transition: background 0.15s;
  }
  .login-btn:hover { background: var(--lava); border-color: var(--lava); color: white; }
  .login-btn svg { width: 16px; height: 16px; }
  .auth-foot {
    margin-top: 1.8rem; padding-top: 1.4rem;
    border-top: 1px solid var(--rule-faint);
    font-family: var(--font-mono); font-size: 0.66rem;
    color: var(--ink-mute); letter-spacing: 0.1em;
  }
  .auth-foot strong { color: var(--ink); font-weight: 500; }
</style>
</head>
<body>
  <main class="auth-card">
    <div class="auth-mark"><span class="mark">A</span> Anthrop<em>\</em>c · Foundations</div>
    <div class="auth-eyebrow">Sign in required</div>
    <h1>Welcome <em>back.</em></h1>
    <p>The Foundations study companion is now multi-user. Your progress, notes, flashcards, and mock-exam attempts sync across devices once you sign in.</p>
    <a class="login-btn" href="/api/login">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Sign in with Replit
    </a>
    <div class="auth-foot">Single sign-on via <strong>Replit Auth</strong> · No password to remember</div>
  </main>
</body>
</html>
